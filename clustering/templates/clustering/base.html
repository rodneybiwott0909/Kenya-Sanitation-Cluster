<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Kenya Sanitation Clusters{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head><body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-success mb-4"><div class="container">
  <a class="navbar-brand" href="{% url 'dashboard' %}">Kenya Sanitation Clusters</a>
  <div class="navbar-nav me-auto">
    <a class="nav-link" href="{% url 'counties' %}">Counties</a>
    <a class="nav-link" href="{% url 'runs' %}">Runs</a>
    <a class="nav-link" href="{% url 'upload' %}">Upload data</a>
  </div>
  <div class="navbar-nav">
    {% if user.is_authenticated %}<span class="navbar-text me-3">{{ user.username }}</span>
    {% else %}<a class="nav-link" href="/admin/login/?next={{ request.path }}">Sign in</a>{% endif %}
  </div></div></nav>
<main class="container pb-5">
  {% for m in messages %}<div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main></body></html>
